name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Record interpreter
        run: python --version
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Reproduce independent study
        run: python studies/reward-reconstruction/reproduce.py
      - name: Compare the two scoring rules
        run: python studies/scoring-unit/reproduce.py
      - name: Distinguish a successful collector from a complete batch
        run: python studies/incomplete-run/reproduce.py
